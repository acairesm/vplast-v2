  <text x="990" y="300" font-family="Arial, sans-serif" font-size="22" fill="white" text-anchor="middle" opacity="0.9">Fitas Crepe</text>
  <text x="990" y="340" font-family="Arial, sans-serif" font-size="22" fill="white" text-anchor="middle" opacity="0.9">Dupla Face</text>
  <text x="990" y="380" font-family="Arial, sans-serif" font-size="22" fill="white" text-anchor="middle" opacity="0.9">Fitas Impressas</text>
  <text x="990" y="420" font-family="Arial, sans-serif" font-size="22" fill="white" text-anchor="middle" opacity="0.9">Gomadas</text>
  <text x="990" y="460" font-family="Arial, sans-serif" font-size="22" fill="white" text-anchor="middle" opacity="0.9">Personalizadas</text>
